name: Deploy to Staging

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/**'
      - 'deployment/**'
      - 'infrastructure/**'
      - 'requirements.txt'
  
  workflow_dispatch:  # This will reappear once the file is valid

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.9'
  ENVIRONMENT: staging

jobs:
  # Job 1: Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/apartment-pipeline-staging
          tags: |
            type=raw,value=latest
            type=sha,prefix=staging-
            type=raw,value=staging-${{ github.run_number }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=staging
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
  
  # Job 2: Deploy Infrastructure with Terraform
  deploy-infrastructure:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Wait for ECR propagation
        run: sleep 30
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: terraform init -upgrade
      
      - name: Terraform Plan
        id: plan
        run: |
          FULL_IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/apartment-pipeline-staging:latest"
          
          terraform plan \
            -var="image_uri=$FULL_IMAGE_URI" \
            -var="environment=staging" \
            -out=tfplan
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
      
      - name: Terraform Output
        id: tf-output
        run: |
          echo "lambda_daily=$(terraform output -raw daily_lambda_function_name)" >> $GITHUB_OUTPUT
          echo "lambda_weekly=$(terraform output -raw training_lambda_function_name)" >> $GITHUB_OUTPUT
    
    outputs:
      lambda_daily: ${{ steps.tf-output.outputs.lambda_daily }}
      lambda_weekly: ${{ steps.tf-output.outputs.lambda_weekly }}
  
  # Job 3: Run Integration Tests
  integration-tests:
    if: false
    needs: deploy-infrastructure # FIXED: Pointed to infrastructure instead of update-lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Tests
        run: echo "Running tests..."
  
  # Job 4: Smoke Tests
  smoke-tests:
    if: false
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Run Smoke Tests
        run: echo "Running smoke tests..."
  
  # Job 5: Deployment Summary
  deployment-summary:
    # FIXED: Removed update-lambda from the needs list
    needs: [build-and-push, deploy-infrastructure, integration-tests, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure: ${{ needs.deploy-infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check infrastructure success since tests are currently disabled
          if [ "${{ needs.deploy-infrastructure.result }}" == "success" ]; then
            echo "✅ **Deployment successful! Infrastructure and Lambda are updated.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment failed. Check the Infrastructure job logs.**" >> $GITHUB_STEP_SUMMARY
          fi