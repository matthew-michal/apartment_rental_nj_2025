name: Deploy to Staging

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/**'
      - 'deployment/**'
      - 'infrastructure/**'
      - 'requirements.txt'
  
  workflow_dispatch:  # Allow manual triggers

env:
  AWS_REGION: us-east-1
  PYTHON_VERSION: '3.9'
  ENVIRONMENT: staging

jobs:
  # Job 1: Build and Push Docker Image
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/apartment-pipeline-staging
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest
            type=raw,value=staging-${{ github.run_number }}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ENVIRONMENT=staging
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
      
      - name: Output image details
        run: |
          echo "### Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Pushed at:** $(date)" >> $GITHUB_STEP_SUMMARY
  
  # Job 2: Deploy Infrastructure with Terraform
  deploy-infrastructure:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/environments/staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
      
      - name: Terraform Init
        run: terraform init
      
      - name: Terraform Format Check
        run: terraform fmt -check
      
      - name: Terraform Validate
        run: terraform validate
      
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var="image_tag=staging-${{ github.run_number }}" \
            -var="environment=staging" \
            -out=tfplan
      
      - name: Save Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-staging
          path: infrastructure/environments/staging/tfplan
      
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
      
      - name: Terraform Output
        id: tf-output
        run: |
          echo "lambda_daily=$(terraform output -raw lambda_daily_function)" >> $GITHUB_OUTPUT
          echo "lambda_weekly=$(terraform output -raw lambda_weekly_function)" >> $GITHUB_OUTPUT
          echo "mlflow_bucket=$(terraform output -raw mlflow_bucket)" >> $GITHUB_OUTPUT
      
      - name: Summary
        run: |
          echo "### Infrastructure Deployed 🏗️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda (Daily):** \`${{ steps.tf-output.outputs.lambda_daily }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda (Weekly):** \`${{ steps.tf-output.outputs.lambda_weekly }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**MLflow Bucket:** \`${{ steps.tf-output.outputs.mlflow_bucket }}\`" >> $GITHUB_STEP_SUMMARY
    
    outputs:
      lambda_daily: ${{ steps.tf-output.outputs.lambda_daily }}
      lambda_weekly: ${{ steps.tf-output.outputs.lambda_weekly }}
  
  # Job 3: Update Lambda Functions
  update-lambda:
    needs: [build-and-push, deploy-infrastructure]
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Update Daily Lambda
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/apartment-pipeline-staging:staging-${{ github.run_number }}"
          
          echo "Updating Lambda: ${{ needs.deploy-infrastructure.outputs.lambda_daily }}"
          echo "With image: $IMAGE_URI"
          
          aws lambda update-function-code \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_daily }} \
            --image-uri $IMAGE_URI
          
          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_daily }}
          
          echo "✅ Daily Lambda updated successfully"
      
      - name: Update Weekly Lambda
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/apartment-pipeline-staging:staging-${{ github.run_number }}"
    
          echo "Updating Lambda: ${{ needs.deploy-infrastructure.outputs.lambda_weekly }}"
          echo "With image: $IMAGE_URI"
          
          aws lambda update-function-code \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_weekly }} \
            --image-uri $IMAGE_URI
          
          # Wait for update to complete
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infrastructure.outputs.lambda_weekly }}
          
          echo "✅ Weekly Lambda updated successfully"
  
  # Job 4: Run Integration Tests
  integration-tests:
    needs: update-lambda
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install test dependencies
        run: |
          pip install boto3 pytest requests
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Test Daily Lambda
        run: |
          python tests/integration/test_lambda_daily.py --environment staging
      
      - name: Test Weekly Lambda
        run: |
          python tests/integration/test_lambda_weekly.py --environment staging
      
      - name: Test S3 Access
        run: |
          python tests/integration/test_s3_access.py --environment staging
      
      - name: Test Monitoring Setup
        run: |
          python tests/integration/test_monitoring.py --environment staging
  
  # Job 5: Smoke Tests
  smoke-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Invoke Daily Lambda (dry run)
        run: |
          RESPONSE=$(aws lambda invoke \
            --function-name apartment-daily-predictions-staging \
            --payload '{"dry_run": true}' \
            --query 'StatusCode' \
            --output text \
            /tmp/response.json)
          
          if [ $RESPONSE -eq 200 ]; then
            echo "✅ Daily Lambda invoked successfully"
            cat /tmp/response.json
          else
            echo "❌ Daily Lambda invocation failed"
            exit 1
          fi
      
      - name: Check CloudWatch Logs
        run: |
          # Get latest log stream
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name /aws/lambda/apartment-daily-predictions-staging \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --query 'logStreams[0].logStreamName' \
            --output text)
          
          echo "Latest log stream: $LOG_STREAM"
          
          # Check for errors
          ERROR_COUNT=$(aws logs filter-log-events \
            --log-group-name /aws/lambda/apartment-daily-predictions-staging \
            --log-stream-names $LOG_STREAM \
            --filter-pattern "ERROR" \
            --query 'events[*].message' \
            --output text | wc -l)
          
          if [ $ERROR_COUNT -gt 0 ]; then
            echo "⚠️ Found $ERROR_COUNT errors in logs"
            aws logs filter-log-events \
              --log-group-name /aws/lambda/apartment-daily-predictions-staging \
              --log-stream-names $LOG_STREAM \
              --filter-pattern "ERROR"
          else
            echo "✅ No errors found in logs"
          fi
  
  # Job 6: Deployment Summary
  deployment-summary:
    needs: [build-and-push, deploy-infrastructure, update-lambda, integration-tests, smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Create deployment summary
        run: |
          echo "# 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Build & Push: ${{ needs.build-and-push.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure: ${{ needs.deploy-infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Lambda Update: ${{ needs.update-lambda.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke Tests: ${{ needs.smoke-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
            echo "✅ **Deployment successful! Staging is ready.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Deployment had issues. Check logs above.**" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Notify Slack (optional)
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK" ]; then
            curl -X POST $SLACK_WEBHOOK \
              -H 'Content-Type: application/json' \
              -d '{
                "text": "Staging Deployment: ${{ job.status }}",
                "attachments": [{
                  "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
                  "fields": [
                    {"title": "Environment", "value": "Staging", "short": true},
                    {"title": "Commit", "value": "${{ github.sha }}", "short": true},
                    {"title": "Actor", "value": "${{ github.actor }}", "short": true}
                  ]
                }]
              }'
          fi
